[package]
edition = "2024"
name = "rs-gigatoken"
version = "0.10.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "High-throughput, Rust-native BPE tokenization"
readme = "README.md"
keywords = [
    "tokenizer",
    "bpe",
    "nlp",
    "llm",
    "machine-learning",
]
categories = [
    "text-processing",
    "science",
]
license = "MIT"
repository = "https://github.com/InfidelRahul/rs-gigatoken"

[lib]
name = "rs_gigatoken"
path = "src/lib.rs"

[[test]]
name = "rust_api"
path = "tests/rust_api.rs"

[[bench]]
name = "encode"
path = "benches/encode.rs"
test = false
harness = false

[[bench]]
name = "encode_doc"
path = "benches/encode_doc.rs"
test = false
harness = false

[[bench]]
name = "encode_st"
path = "benches/encode_st.rs"
test = false
harness = false

[[bench]]
name = "encode_st_sp"
path = "benches/encode_st_sp.rs"
test = false
harness = false

[[bench]]
name = "pretokenize"
path = "benches/pretokenize.rs"
harness = false

[[bench]]
name = "pretokenize_profile"
path = "benches/pretokenize_profile.rs"
test = false
harness = false

[[bench]]
name = "pretokenize_profile_all"
path = "benches/pretokenize_profile_all.rs"
test = false
harness = false

[[bench]]
name = "simdutf_transcode"
path = "benches/simdutf_transcode.rs"
harness = false

[[bench]]
name = "unicode"
path = "benches/unicode.rs"

[dependencies.aho-corasick]
version = "1.1"

[dependencies.arrow-array]
version = "59"

[dependencies.arrow-schema]
version = "59"

[dependencies.base64]
version = "0.22"

[dependencies.dashmap]
version = "6.1"

[dependencies.eyre]
version = "0.6.12"

[dependencies.flate2]
version = "1.1"

[dependencies.icu]
version = "2.2"
features = [
    "compiled_data",
    "datagen",
]

[dependencies.indicatif]
version = "0.18"

[dependencies.itertools]
version = "0.15"

[dependencies.memchr]
version = "2.8.0"

[dependencies.memmap2]
version = "0.9"
features = ["stable_deref_trait"]

[dependencies.parquet]
version = "59.1.0"
features = [
    "arrow",
    "snap",
    "zstd",
    "flate2",
    "lz4",
    "brotli",
    "flate2-rust_backend",
]
default-features = false

[dependencies.priority-queue]
version = "2.0"

[dependencies.rayon]
version = "1.11"

[dependencies.rustc-hash]
version = "2.1"

[dependencies.serde]
version = "1.0.228"
features = ["derive"]

[dependencies.simdutf]
version = "0.7.0"

[dependencies.sonic-rs]
version = "0.5.8"

[dependencies.spm_precompiled]
version = "0.1.4"

[dependencies.ureq]
version = "3.3.0"
features = ["rustls"]
default-features = false

[dependencies.winnow]
version = "1"
features = ["simd"]

[dependencies.zstd]
version = "0.13"

[dev-dependencies.criterion]
version = "0.8"

[dev-dependencies.fancy-regex]
version = "0.18.0"

[dev-dependencies.rand]
version = "0.10"

[dev-dependencies.simdutf]
version = "0.7.0"

[dev-dependencies.tempfile]
version = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies.libc]
version = "0.2"

[lints.rust]
unused = "allow"

